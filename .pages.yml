media:
  - name: gecko_images
    label: Gecko photos
    input: assets/images/geckos
    output: /assets/images/geckos
    categories: [image]
    rename: safe
  - name: lineage_images
    label: Lineage photos
    input: assets/images/lineage
    output: /assets/images/lineage
    categories: [image]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user

content:
  - name: geckos
    label: Geckos
    type: collection
    path: _geckos
    format: yaml-frontmatter
    filename:
      template: "{animal_id}.md"
      field: create
    view:
      primary: name
    fields:
      - name: animal_id
        label: Animal ID
        type: string
        required: true
        description: "Create the ID first. This becomes the record filename."
      - name: name
        label: Proper name
        type: string
        required: true
      - name: identifier
        label: Identifier
        type: string
        description: "Working identifier or source label, such as Male Singularity or Female Sable."
      - name: photos
        label: Photos
        type: image
        options:
          media: gecko_images
          multiple:
            max: 12
          unique: true
          rename: safe
        description: "Add several photos here. The first photo becomes the main profile image."
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - name: with-us
              label: With us
            - name: available
              label: Available
            - name: placed
              label: Placed
            - name: lineage
              label: Lineage record
      - name: sex
        label: Sex
        type: string
      - name: hatch_date
        label: Hatch date
        type: string
        description: "Free text so uncertain dates can stay uncertain."
      - name: morph
        label: Traits / morph
        type: string
      - name: weight
        label: Weight
        type: string
      - name: price
        label: Price
        type: string
        description: "Used only when relevant to an available animal."
      - name: placement_note
        label: Placement note
        type: string
        description: "Short note such as Pet only."
      - name: summary
        label: Short description
        type: text
      - name: sire
        label: Sire (father)
        type: reference
        options:
          collection: geckos
          search: "name,animal_id"
          value: "{name}"
          label: "{name}"
        description: "Select an existing father, or expand Create new father below."
      - name: dam
        label: Dam (mother)
        type: reference
        options:
          collection: geckos
          search: "name,animal_id"
          value: "{name}"
          label: "{name}"
        description: "Select an existing mother, or expand Create new mother below."
      - name: new_sire
        label: Create new father (expand here)
        type: object
        fields:
          - name: name
            label: Father's name
            type: string
            description: "Leave blank unless creating a new father profile."
          - name: photo
            label: Father's photo
            type: image
            options:
              media: lineage_images
          - name: morph
            label: Traits / morph
            type: string
          - name: source
            label: Source / breeder
            type: string
          - name: parents
            label: Father's own parentage (optional)
            type: string
      - name: new_dam
        label: Create new mother (expand here)
        type: object
        fields:
          - name: name
            label: Mother's name
            type: string
            description: "Leave blank unless creating a new mother profile."
          - name: photo
            label: Mother's photo
            type: image
            options:
              media: lineage_images
          - name: morph
            label: Traits / morph
            type: string
          - name: source
            label: Source / breeder
            type: string
          - name: parents
            label: Mother's own parentage (optional)
            type: string
      - name: sire_photo
        label: Father photo (optional)
        type: image
        options:
          media: lineage_images
        description: "Optional photo of the father for this lineage. If empty, use the father's own profile photo."
      - name: dam_photo
        label: Mother photo (optional)
        type: image
        options:
          media: lineage_images
        description: "Optional photo of the mother for this lineage. If empty, use the mother's own profile photo."
      - name: parents
        label: Legacy parentage / external lineage
        type: string
        description: "Keep existing parentage text for historical or external parents. Structured sire/dam selections take priority in the family tree."
      - name: source
        label: Source
        type: string
      - name: body
        label: Notes / profile
        type: rich-text
        options:
          media: gecko_images
          rename: safe

  - name: lineage
    label: Lineage
    type: file
    path: _data/lineage.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: pairings
        label: Pairings & offspring
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{pairing}"
        fields:
          - name: pairing
            label: Pairing
            type: string
            required: true
          - name: source
            label: Source
            type: string
          - name: hatch_date
            label: Hatch date
            type: string
          - name: notes
            label: Pairing notes
            type: text
          - name: photos
            label: Pairing photos
            type: image
            options:
              media: lineage_images
              multiple:
                max: 12
              unique: true
              rename: safe
          - name: offspring
            label: Offspring
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{id} · {date}"
            fields:
              - name: id
                label: ID
                type: string
                required: true
              - name: date
                label: Hatch date
                type: string
              - name: sex
                label: Sex
                type: string
              - name: notes
                label: Notes
                type: text
              - name: photos
                label: Photos
                type: image
                options:
                  media: lineage_images
                  multiple:
                    max: 12
                  unique: true
                  rename: safe
      - name: lineage_records
        label: Additional family histories
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{parents}"
        fields:
          - name: parents
            label: Parents
            type: string
            required: true
          - name: source
            label: Source
            type: string
          - name: hatch_date
            label: Hatch date
            type: string
          - name: traits
            label: Traits / morph
            type: string
          - name: notes
            label: Notes
            type: text
          - name: photos
            label: Photos
            type: image
            options:
              media: lineage_images
              multiple:
                max: 12
              unique: true
              rename: safe
      - name: adults
        label: Adults / established animals
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: notes
            label: Notes
            type: text
          - name: photos
            label: Photos
            type: image
            options:
              media: lineage_images
              multiple:
                max: 12
              unique: true
              rename: safe
      - name: unresolved
        label: Unresolved records
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{item}"
        fields:
          - name: item
            label: Record
            type: string
            required: true
          - name: notes
            label: Notes
            type: text
