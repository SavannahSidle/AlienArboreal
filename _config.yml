title: Alien Arboreal
description: "Crested geckos and select species raised with careful husbandry, biological curiosity, and respect for life. Based in Ottawa, Ontario."
url: "https://alienarboreal.com"
baseurl: ""
author: Alien Arboreal
email: "AlienArboreal@hotmail.com"
instagram: "https://www.instagram.com/AlienArboreal"
facebook: "https://www.facebook.com/AlienArboreal"
tiktok: "https://www.tiktok.com/@alien.arboreal"
youtube: "https://www.youtube.com/@Alien.Arboreal"
morphmarket: "https://www.morphmarket.com/stores/AlienArboreal"
location: "Ottawa, Ontario, Canada"

collections:
  geckos:
    output: true
    permalink: /geckos/:name/
  observations:
    output: true
    permalink: /observations/:name/
  pairings:
    output: false
  clutches:
    output: false

defaults:
  - scope:
      path: ""
      type: "geckos"
    values:
      layout: "gecko"
  - scope:
      path: ""
      type: "observations"
    values:
      layout: "observation"
  - scope:
      path: ""
      type: "pairings"
    values:
      layout: "pairing"
  - scope:
      path: ""
      type: "clutches"
    values:
      layout: "clutch"
  - scope:
      path: ""
    values:
      layout: "page"

nav_links:
  - title: Available
    url: /available/
  - title: Our Geckos
    url: /our-geckos/
  - title: Pairings
    url: /pairings/
  - title: Lineage
    url: /lineage/
  - title: Care
    url: /care/
  - title: Observation Log
    url: /observations/
  - title: Biology & Husbandry
    url: /breeding-biology/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - _templates

markdown: kramdown
highlighter: rouge
