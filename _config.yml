title: Alien Arboreal
description: "Captive-bred crested geckos, biological observations, and the small systems that make them work. Based in Ottawa, Ontario."
url: "https://savannahsidle.github.io"
baseurl: "/AlienArboreal"
author: Alien Arboreal
email: "[BUSINESS_EMAIL]"
instagram: "[INSTAGRAM_URL]"
facebook: "[FACEBOOK_URL]"
location: "Ottawa, Ontario, Canada"

collections:
  geckos:
    output: true
    permalink: /geckos/:name/
  observations:
    output: true
    permalink: /observations/:name/
  pairings:
    output: false
  clutches:
    output: false

defaults:
  - scope:
      path: ""
      type: "geckos"
    values:
      layout: "gecko"
  - scope:
      path: ""
      type: "observations"
    values:
      layout: "observation"
  - scope:
      path: ""
      type: "pairings"
    values:
      layout: "pairing"
  - scope:
      path: ""
      type: "clutches"
    values:
      layout: "clutch"
  - scope:
      path: ""
    values:
      layout: "page"

nav_links:
  - title: Home
    url: /
  - title: Available Geckos
    url: /available/
  - title: Observation Log
    url: /observations/
  - title: Breeding & Biology
    url: /breeding-biology/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - _templates

markdown: kramdown
highlighter: rouge
